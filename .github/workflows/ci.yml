# Backend CI (TRS D-23, LLD 17.3): parallel jobs, one required check `ci-success`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siliconia
          POSTGRES_PASSWORD: siliconia
          POSTGRES_DB: siliconia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siliconia" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://siliconia:siliconia@localhost:5432/siliconia_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated SQL code is up to date
        run: docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.27.0 diff
      - name: OpenAPI spec is valid
        run: npx --yes @redocly/cli@1 lint api/openapi.yaml --skip-rule no-server-example.com --skip-rule operation-4xx-response --skip-rule info-license --skip-rule operation-2xx-response

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose file is valid
        run: cp deploy/compose/.env.example deploy/compose/.env && docker compose -f deploy/compose/docker-compose.yml config -q

  ci-success:
    if: always()
    needs: [lint, unit, integration, contract, security, build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
