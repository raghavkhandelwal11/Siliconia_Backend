# Publishes the backend image (every binary) to GHCR after each merge, for
# servers too small to compile it (the lite server). Tags: the commit SHA and
# "main". Built for linux/amd64 (Oracle AMD micro) and linux/arm64 (Ampere).
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/raghavkhandelwal11/siliconia-backend:${{ github.sha }}
            ghcr.io/raghavkhandelwal11/siliconia-backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
