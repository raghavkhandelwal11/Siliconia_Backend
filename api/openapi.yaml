openapi: 3.1.0
info:
  title: Siliconics API
  version: 1.1.0
  description: |
    REST API for the Siliconics prototype (LLD section 7). Source of truth for the
    HTTP contract; the web app generates its TypeScript client from this file.
    Errors use RFC 9457 problem details.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [system]
      security: []
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: The API process is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe (PostgreSQL and Redis)
      tags: [system]
      security: []
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: All dependencies are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: At least one dependency is down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /auth/otp/send:
    post:
      operationId: sendSignInOtp
      summary: Send a 6-digit sign-in code by SMS (FR-AUTH-01)
      description: Limits are 3 codes per number per 15 minutes, 10 per IP per hour and one every 30 seconds.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, role]
              properties:
                phone: { type: string, description: 10-digit Indian mobile number, example: "9876543210" }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, resendAfterSec, expiresInSec]
                properties:
                  challengeId: { type: string, format: uuid }
                  resendAfterSec: { type: integer }
                  expiresInSec: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/otp/verify:
    post:
      operationId: verifySignInOtp
      summary: Check the code; signs in, creating the account on first use
      description: Sets the sx_at, sx_rt and sx_csrf cookies. Admin accounts cannot be created here.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [account, isNew]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
                  isNew: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: Uses the sx_rt cookie. Reusing an old refresh token signs out every device in that session family.
      tags: [auth]
      security: [{ csrfHeader: [] }]
      responses:
        "200":
          description: New cookies set
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      operationId: logout
      summary: End this session and clear cookies
      tags: [auth]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Signed out }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/google/status:
    get:
      operationId: getGoogleStatus
      summary: Whether "Continue with Google" is configured
      tags: [auth]
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Redirect to Google (OpenID Connect with PKCE) (FR-AUTH-04)
      tags: [auth]
      security: []
      parameters:
        - { name: role, in: query, required: true, schema: { $ref: "#/components/schemas/Role" } }
        - { name: next, in: query, required: false, schema: { type: string }, description: Relative path to return to }
      responses:
        "302": { description: Redirect to Google }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/google/callback:
    get:
      operationId: googleCallback
      summary: Google returns here; signs in and redirects into the web app
      description: New Google accounts are sent to /auth/verify-phone because a verified mobile number is required to order.
      tags: [auth]
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect to the web app (or /auth/sign-in?error=...) }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/totp/status:
    get:
      operationId: getTotpStatus
      summary: Admin authenticator status
      tags: [auth, admin]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [enrolled, verified]
                properties:
                  enrolled: { type: boolean }
                  verified: { type: boolean, description: This session has passed TOTP }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/totp/setup:
    post:
      operationId: setupTotp
      summary: Create the admin's authenticator secret (only before it is confirmed)
      tags: [auth, admin]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri]
                properties:
                  secret: { type: string }
                  otpauthUri: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/totp/verify:
    post:
      operationId: verifyTotp
      summary: Check the authenticator code; unlocks admin features for this session
      tags: [auth, admin]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: Verified; new access cookie set }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me:
    get:
      operationId: getMe
      summary: The signed-in account
      tags: [account]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    patch:
      operationId: updateMe
      summary: Update name and email
      tags: [account]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: [string, "null"], maxLength: 254 }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/phone/otp:
    post:
      operationId: sendPhoneVerifyOtp
      summary: Send a code to add or verify a mobile number (Google accounts)
      tags: [account]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, resendAfterSec]
                properties:
                  challengeId: { type: string, format: uuid }
                  resendAfterSec: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/phone/verify:
    post:
      operationId: verifyPhone
      summary: Confirm the code and save the verified number
      tags: [account]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/sessions:
    get:
      operationId: listSessions
      summary: Devices signed in to this account
      tags: [account]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign out one device
      tags: [account]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/role-switch:
    post:
      operationId: switchAdminRole
      summary: Admin acts as another role (null returns to admin); audited (FR-ROLE-05)
      tags: [admin]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  oneOf:
                    - { $ref: "#/components/schemas/Role" }
                    - { type: "null" }
      responses:
        "200":
          description: Switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  actingRole: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /categories:
    get:
      operationId: listCategories
      summary: The category tree (12 categories with their sub-categories)
      description: Cached for 60 s; send If-None-Match with the ETag to get 304 when unchanged.
      tags: [catalogue]
      security: []
      responses:
        "200":
          description: Active categories, in menu order
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: "#/components/schemas/CategoryNode" }
        "304": { description: Not modified }
        "429": { $ref: "#/components/responses/RateLimited" }
  /categories/{slug}:
    get:
      operationId: getCategory
      summary: One category with its parent, sub-categories and spec schema
      tags: [catalogue]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Category
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryDetail" }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/application:
    get:
      operationId: getSellerApplication
      summary: The seller's onboarding application (created on first visit)
      tags: [seller]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerApplication" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      operationId: saveSellerBusiness
      summary: Save business details and pickup address (draft or rejected only)
      description: Changing the legal name clears the PAN and bank checks.
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                businessType: { $ref: "#/components/schemas/BusinessType" }
                legalName: { type: string, maxLength: 120 }
                storeName: { type: string, maxLength: 60 }
                gstin: { type: string }
                pickupAddress: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerApplication" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/application/pan:
    post:
      operationId: checkSellerPan
      summary: Verify the PAN against the legal name (KYC provider; 10 checks an hour)
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pan]
              properties:
                pan: { type: string, example: ABCDE1234F }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerApplication" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/application/bank:
    post:
      operationId: checkSellerBank
      summary: Penny-drop the payout account against the legal name
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account, ifsc]
              properties:
                account: { type: string }
                ifsc: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerApplication" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/application/submit:
    post:
      operationId: submitSellerApplication
      summary: Submit a complete application for review
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acceptTerms]
              properties:
                acceptTerms: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerApplication" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/approvals/sellers:
    get:
      operationId: listSellerApplications
      summary: Seller approval queue (UI-ADM-02)
      tags: [admin]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected, draft], default: pending } }
      responses:
        "200":
          description: Applications, oldest submission first
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications: { type: array, items: { $ref: "#/components/schemas/SellerQueueItem" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/approvals/sellers/{accountId}:
    get:
      operationId: getSellerApplicationForReview
      summary: One application with KYC results (PAN and bank masked)
      tags: [admin]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerReview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/approvals/sellers/{accountId}/decision:
    post:
      operationId: decideSellerApplication
      summary: Approve or reject; audited, and the seller gets an SMS
      description: Blocked while the admin is viewing as another role. A rejection needs a reason of at least 10 characters.
      tags: [admin]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerReview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /media/{key}:
    get:
      operationId: getMedia
      summary: A stored product image (JPEG), cached for a year
      tags: [catalogue]
      security: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, description: "Storage key under products/, may contain slashes" }
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/uploads/images:
    post:
      operationId: uploadProductImage
      summary: Upload a product image (JPEG, PNG or WebP, up to 8 MB, at least 400 px)
      description: The API decodes the image, scales it to at most 1600 px and stores it as JPEG, dropping EXIF data. 60 uploads an hour.
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/products:
    get:
      operationId: listSellerProducts
      summary: The seller's products, most recently changed first
      tags: [seller]
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products: { type: array, items: { $ref: "#/components/schemas/ProductSummary" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createProduct
      summary: Start a draft product in a sub-category (approved sellers only)
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categoryId, name]
              properties:
                categoryId: { type: string, format: uuid }
                name: { type: string, minLength: 3, maxLength: 150 }
                brand: { type: string, maxLength: 60 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEditor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/products/{id}:
    get:
      operationId: getSellerProduct
      summary: One product with variants, stock, images and what publishing still needs
      tags: [seller]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEditor" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      operationId: updateProduct
      summary: Save details and specifications (specs are checked against the category)
      description: Send the version you loaded; a stale version gives 409 VERSION_CONFLICT. Invalid specs give 422 SPECS_INVALID with per-field messages.
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [categoryId, name, version]
              properties:
                categoryId: { type: string, format: uuid }
                name: { type: string }
                brand: { type: string }
                model: { type: string }
                description: { type: string, maxLength: 5000 }
                warranty: { type: string, maxLength: 200 }
                originCountry: { type: string, pattern: "^[A-Za-z]{2}$" }
                isLocal: { type: boolean }
                specs: { type: object, additionalProperties: true }
                version: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEditor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/products/{id}/variants:
    put:
      operationId: saveVariants
      summary: Replace the variant set with prices and stock
      description: Variants with reserved or sold units cannot be removed, and stock cannot go below them.
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [variants]
              properties:
                variants: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/VariantInput" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEditor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/products/{id}/images:
    put:
      operationId: saveImages
      summary: Set the image list in display order (the first is the cover)
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [uploadId]
                    properties:
                      uploadId: { type: string, format: uuid }
                      alt: { type: string, maxLength: 150 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEditor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /seller/products/{id}/status:
    post:
      operationId: setProductStatus
      summary: Publish (ACTIVE), pause or resume a product
      tags: [seller]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, PAUSED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductEditor" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /products:
    get:
      operationId: searchProducts
      summary: Search and category listing with filters, facets and sorting (UI-PUB-03)
      description: |
        Only live products from approved sellers. Text search uses full-text plus fuzzy matching.
        Spec filters apply to a sub-category: `spec.<key>=a,b` for choices, `spec.<key>=true` for yes/no,
        `spec.<key>=4..8` for number ranges. Facets for a group ignore that group's own selection.
        Cached for 30 seconds.
      tags: [catalogue]
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string }, description: "Slug; a top-level category includes its sub-categories" }
        - { name: brand, in: query, schema: { type: string }, description: Comma-separated }
        - { name: priceMin, in: query, schema: { type: integer, format: int64 }, description: Paise }
        - { name: priceMax, in: query, schema: { type: integer, format: int64 }, description: Paise }
        - { name: rating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: local, in: query, schema: { type: boolean } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: verified, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, price_asc, price_desc, newest, rating, popular], default: relevance } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
        - name: spec
          in: query
          style: deepObject
          explode: true
          schema: { type: object, additionalProperties: { type: string } }
          description: "Spec filters sent as spec.<key>=<value> (see description)"
      responses:
        "200":
          description: One page of results with facets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /products/suggest:
    get:
      operationId: suggestProducts
      summary: Search-box suggestions (products, brands, sub-categories) for 2+ characters
      tags: [catalogue]
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 60 } }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /products/{slug}:
    get:
      operationId: getProduct
      summary: A live product for its page (static, cacheable for 60 s)
      tags: [catalogue]
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /products/{id}/live:
    get:
      operationId: getProductLive
      summary: Current price, stock, Electrons and the viewer's actions (never cached)
      description: Works signed out; when the session cookie is present the actions follow the viewer's role.
      tags: [catalogue]
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Live block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductLive" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /products/{id}/similar:
    get:
      operationId: getSimilarProducts
      summary: Up to 8 live products from the same sub-category, closest in price
      tags: [catalogue]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Similar products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ProductCard" } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /cart:
    get:
      operationId: getCart
      summary: The cart, grouped by seller, with stock and price warnings (UI-BUY-01)
      description: |
        Guests are identified by the sx_dev cookie, set on their first cart write together with sx_csrf.
        When a signed-in buyer still has a guest cart on this device, it is merged first and `merged` says so.
      tags: [cart]
      security: [{}, { sessionCookie: [] }]
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /cart/merge:
    post:
      operationId: mergeCart
      summary: Merge this device's guest cart into the buyer's cart (also done by GET /cart)
      tags: [cart]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /cart/items/{variantId}:
    put:
      operationId: setCartItem
      summary: Set a line's quantity (1–10, capped by stock; 0 removes it)
      tags: [cart]
      security: [{ csrfHeader: [] }, { sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [qty]
              properties:
                qty: { type: integer, minimum: 0, maximum: 10 }
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: removeCartItem
      summary: Remove a line
      tags: [cart]
      security: [{ csrfHeader: [] }, { sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /wishlist:
    get:
      operationId: getWishlist
      summary: Saved products with price-drop and stock state (UI-BUY-10)
      tags: [cart]
      responses:
        "200":
          description: Wishlist
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WishItem" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /wishlist/{variantId}:
    put:
      operationId: saveToWishlist
      summary: Save a variant (buyers)
      tags: [cart]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Saved }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      operationId: removeFromWishlist
      summary: Remove a saved variant
      tags: [cart]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/addresses:
    get:
      operationId: listAddresses
      summary: The buyer's saved delivery addresses (default first, at most 10)
      tags: [checkout]
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [items, max]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DeliveryAddress" } }
                  max: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAddress
      summary: Save an address; the first one (or one marked default) becomes the default
      tags: [checkout]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/addresses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateAddress
      summary: Change an address (past orders keep their snapshot)
      tags: [checkout]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAddress" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAddress
      summary: Delete an address
      tags: [checkout]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /checkout/quote:
    post:
      operationId: quoteCheckout
      summary: Price the cart for an address and pay method (UI-BUY-02)
      description: |
        Re-prices every line from live data. Send the returned `quoteHash` with POST /orders; if prices,
        stock, address or pay method change in between, placing the order fails with QUOTE_CHANGED.
        Shipping is free in the prototype. COD is offered up to `codLimitPaise`.
      tags: [checkout]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addressId: { type: string, format: uuid }
                payMethod: { type: string, enum: [ONLINE, COD] }
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /orders:
    get:
      operationId: listOrders
      summary: The buyer's orders, newest first
      tags: [orders]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OrderSummary" } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: placeOrder
      summary: Place the order from the cart (UI-BUY-03)
      description: |
        Reserves stock in the same transaction (never oversells) and clears the cart. COD orders are CONFIRMED
        at once. ONLINE orders wait in PENDING_PAYMENT for `checkout.hold_minutes` (10) with
        `payment.checkoutUrl` to the payment page; unpaid orders expire and release their stock, and a payment
        that arrives after expiry is refunded in full. The same Idempotency-Key returns the same order.
      tags: [orders]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId, payMethod, quoteHash]
              properties:
                addressId: { type: string, format: uuid }
                payMethod: { type: string, enum: [ONLINE, COD] }
                quoteHash: { type: string }
      responses:
        "201":
          description: Placed (or the earlier result for this key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /orders/{id}:
    get:
      operationId: getOrder
      summary: One of the buyer's orders
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }
  /orders/{id}/pay:
    post:
      operationId: payOrder
      summary: Get the payment page again for an order waiting for payment
      tags: [orders]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Where to pay
          content:
            application/json:
              schema:
                type: object
                required: [checkoutUrl]
                properties:
                  checkoutUrl: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /serviceability/{pincode}:
    get:
      operationId: checkServiceability
      summary: Can we deliver to this PIN code, with COD, and how fast (sim-ship)
      tags: [shipping]
      security: []
      parameters:
        - { name: pincode, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]{5}$" } }
      responses:
        "200":
          description: Serviceability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Serviceability" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /seller/sub-orders/{id}/ship:
    post:
      operationId: shipSubOrder
      summary: Book the courier for a confirmed sub-order (AWB and label); moves it to SHIPPED
      description: Idempotent; calling it again returns the same shipment. COD orders collect the sub-order total.
      tags: [shipping]
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weightGrams: { type: integer, minimum: 1, maximum: 50000 }
      responses:
        "200":
          description: The shipment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shipment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /seller/sub-orders/{id}/label:
    get:
      operationId: getShippingLabel
      summary: The 4×6 inch shipping label (PDF)
      tags: [shipping]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Label
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /webhooks/shipping:
    post:
      operationId: shippingWebhook
      summary: Tracking scans from the courier (sim-ship), signed with X-Sim-Signature
      description: |
        Type `shipment.status` with data {awb, ref, kind, status, location, at, eta}. Statuses: MANIFESTED, PICKED_UP,
        IN_TRANSIT, OUT_FOR_DELIVERY, FAILED_ATTEMPT, DELIVERED, RTO_INITIATED, RTO_DELIVERED, CANCELLED.
        De-duplicated on the event id; scans older than the last one are recorded but do not change the status.
      tags: [shipping]
      security: []
      parameters:
        - { name: X-Sim-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id: { type: string }
                type: { type: string }
                created: { type: integer }
                data: { type: object, additionalProperties: true }
      responses:
        "200": { description: Applied (or already applied) }
        "400": { description: Bad signature or malformed event }
        "500": { description: Not applied; the courier retries }
  /webhooks/payment:
    post:
      operationId: paymentWebhook
      summary: Payment provider events (sim-pay), signed with X-Sim-Signature
      description: |
        `X-Sim-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, t + "." + body)>`, rejected beyond 5 minutes.
        Events are de-duplicated on their id and applied in the same transaction; 200 means stored and applied.
        Types: payment.captured, payment.failed, refund.processed, refund.failed, mandate.active, mandate.failed, mandate.revoked.
      tags: [payments]
      security: []
      parameters:
        - { name: X-Sim-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id: { type: string }
                type: { type: string }
                created: { type: integer }
                data: { type: object, additionalProperties: true }
      responses:
        "200": { description: Applied (or already applied) }
        "400": { description: Bad signature or malformed event }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { description: Not applied; the provider retries }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sx_at
      description: Short-lived access token set by sign-in (LLD 4.2).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Copy of the sx_csrf cookie, required on state-changing requests that carry session cookies (double-submit CSRF).
  schemas:
    Role:
      type: string
      enum: [BUYER, SELLER, PROMOTER, CREATOR, ADMIN]
    Account:
      type: object
      required: [id, role, name, phoneVerified, approval, mfaVerified, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        actingRole: { $ref: "#/components/schemas/Role" }
        name: { type: string }
        email: { type: string }
        phone: { type: string, description: "E.164, e.g. +919876543210" }
        phoneVerified: { type: boolean }
        approval: { type: string, enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, SUSPENDED] }
        mfaVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [id, userAgent, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }
    CategoryNode:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        icon: { type: string, description: Icon key for top-level categories }
        examples: { type: string, description: Example products for sub-categories }
        children:
          type: array
          items: { $ref: "#/components/schemas/CategoryNode" }
    CategoryDetail:
      type: object
      required: [id, slug, name, children, specSchema]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        icon: { type: string }
        examples: { type: string }
        parent: { $ref: "#/components/schemas/CategoryNode" }
        children:
          type: array
          items: { $ref: "#/components/schemas/CategoryNode" }
        specSchema: { $ref: "#/components/schemas/SpecSchema" }
    SpecSchema:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items: { $ref: "#/components/schemas/SpecField" }
    SpecField:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        label: { type: string }
        type: { type: string, enum: [number, text, enum, multi, boolean] }
        unit: { type: string }
        options: { type: array, items: { type: string } }
        required: { type: boolean }
        filter: { type: boolean, description: Offered as a listing filter }
        main: { type: boolean, description: "Shown in main specifications (at most 3)" }
    BusinessType:
      type: string
      enum: [INDIVIDUAL, PROPRIETORSHIP, PARTNERSHIP, LLP, PRIVATE_LIMITED, PUBLIC_LIMITED]
    Address:
      type: object
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: "^[1-9][0-9]{5}$" }
        phone: { type: string }
    KycCheck:
      type: object
      required: [status, nameMatch, checkedAt]
      properties:
        status: { type: string, enum: [VERIFIED, FAILED, NAME_MISMATCH] }
        reason: { type: string }
        nameMatch: { type: number }
        checkedAt: { type: string, format: date-time }
    SellerApplication:
      type: object
      required: [accountId, approval, editable, phoneVerified, legalName, storeName, gstinRequired, panVerified, bankVerified, termsVersion, missing]
      properties:
        accountId: { type: string, format: uuid }
        approval: { type: string, enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, SUSPENDED] }
        reason: { type: string, description: Admin's reason for the last decision }
        editable: { type: boolean }
        phoneVerified: { type: boolean }
        businessType: { $ref: "#/components/schemas/BusinessType" }
        legalName: { type: string }
        storeName: { type: string }
        gstin: { type: string }
        gstinRequired: { type: boolean }
        panLast4: { type: string }
        panVerified: { type: boolean }
        bankLast4: { type: string }
        ifsc: { type: string }
        bankVerified: { type: boolean }
        pickupAddress: { $ref: "#/components/schemas/Address" }
        panCheck: { $ref: "#/components/schemas/KycCheck" }
        bankCheck: { $ref: "#/components/schemas/KycCheck" }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        termsVersion: { type: string }
        missing:
          type: array
          description: Steps still to do
          items: { type: string, enum: [phone, business, pan, gstin, bank, pickup] }
    SellerReview:
      allOf:
        - { $ref: "#/components/schemas/SellerApplication" }
        - type: object
          required: [gstinMatchesPan]
          properties:
            phone: { type: string }
            gstinMatchesPan: { type: boolean }
    SellerQueueItem:
      type: object
      required: [accountId, approval, legalName, storeName, panVerified, bankVerified, hasGstin]
      properties:
        accountId: { type: string, format: uuid }
        approval: { type: string }
        businessType: { $ref: "#/components/schemas/BusinessType" }
        legalName: { type: string }
        storeName: { type: string }
        phone: { type: string }
        panVerified: { type: boolean }
        bankVerified: { type: boolean }
        hasGstin: { type: boolean }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    Upload:
      type: object
      required: [id, url, width, height]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
    VariantInput:
      type: object
      additionalProperties: false
      required: [sku, mrpPaise, pricePaise, stock]
      properties:
        id: { type: string, format: uuid, description: Omit for a new variant }
        sku: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$" }
        attrs: { type: object, additionalProperties: { type: string }, description: "Options such as Colour or Storage (up to 5)" }
        mrpPaise: { type: integer, format: int64 }
        pricePaise: { type: integer, format: int64 }
        stock: { type: integer, minimum: 0, maximum: 100000 }
    Variant:
      type: object
      required: [id, sku, attrs, mrpPaise, pricePaise, stock, reserved, sold]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        attrs: { type: object, additionalProperties: { type: string } }
        mrpPaise: { type: integer, format: int64 }
        pricePaise: { type: integer, format: int64 }
        stock: { type: integer }
        reserved: { type: integer }
        sold: { type: integer }
    ProductImage:
      type: object
      required: [uploadId, url, width, height, alt]
      properties:
        uploadId: { type: string, format: uuid }
        url: { type: string }
        width: { type: integer }
        height: { type: integer }
        alt: { type: string }
    FieldError:
      type: object
      required: [key, message]
      properties:
        key: { type: string }
        message: { type: string }
    ProductEditor:
      type: object
      required: [id, slug, status, category, specSchema, name, brand, model, description, warranty, originCountry, isLocal, specs, variants, images, missing, specProblems, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, HIDDEN] }
        category:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            parentName: { type: string }
            parentIcon: { type: string }
        specSchema: { $ref: "#/components/schemas/SpecSchema" }
        name: { type: string }
        brand: { type: string }
        model: { type: string }
        description: { type: string }
        warranty: { type: string }
        originCountry: { type: string }
        isLocal: { type: boolean }
        specs: { type: object, additionalProperties: true }
        variants: { type: array, items: { $ref: "#/components/schemas/Variant" } }
        images: { type: array, items: { $ref: "#/components/schemas/ProductImage" } }
        missing:
          type: array
          description: What publishing still needs
          items: { type: string, enum: [brand, description, warranty, specs, variants, images] }
        specProblems: { type: array, items: { $ref: "#/components/schemas/FieldError" } }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
    ProductSummary:
      type: object
      required: [id, slug, name, brand, status, categoryName, minPricePaise, maxPricePaise, variantCount, available, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, HIDDEN] }
        categoryName: { type: string }
        minPricePaise: { type: integer, format: int64 }
        maxPricePaise: { type: integer, format: int64 }
        variantCount: { type: integer }
        available: { type: integer }
        coverUrl: { type: string }
        updatedAt: { type: string, format: date-time }
    ProductCard:
      type: object
      required: [id, slug, name, brand, pricePaise, mrpPaise, discountPct, inStock, ratingAvg, ratingCount, isLocal, verifiedSeller]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        coverUrl: { type: string }
        pricePaise: { type: integer, format: int64, description: Lowest variant price }
        mrpPaise: { type: integer, format: int64 }
        discountPct: { type: integer }
        inStock: { type: boolean }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
        isLocal: { type: boolean }
        verifiedSeller: { type: boolean }
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        label: { type: string }
        count: { type: integer, format: int64 }
    SpecFacet:
      type: object
      required: [key, label, type]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [number, text, enum, multi, boolean] }
        unit: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
        min: { type: number }
        max: { type: number }
    SearchResult:
      type: object
      required: [items, total, page, pageSize, facets]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProductCard" } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
        facets:
          type: object
          required: [categories, brands, specs]
          properties:
            categories: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
            brands: { type: array, items: { $ref: "#/components/schemas/FacetCount" } }
            price: { type: array, items: { type: integer, format: int64 }, minItems: 2, maxItems: 2, description: "[lowest, highest] price in paise" }
            specs: { type: array, items: { $ref: "#/components/schemas/SpecFacet" } }
        category:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
            icon: { type: string }
            parentSlug: { type: string }
            parentName: { type: string }
        ignoredFilters: { type: array, items: { type: string }, description: Spec filters this category does not have }
    Suggestion:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [product, brand, category] }
        text: { type: string }
        slug: { type: string }
        coverUrl: { type: string }
        brand: { type: string }
    ProductPage:
      type: object
      required: [id, slug, name, brand, model, description, warranty, originCountry, isLocal, ratingAvg, ratingCount, category, seller, specs, variants, images, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        model: { type: string }
        description: { type: string }
        warranty: { type: string }
        originCountry: { type: string }
        isLocal: { type: boolean }
        ratingAvg: { type: number }
        ratingCount: { type: integer }
        category:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
            parentSlug: { type: string }
            parentName: { type: string }
            icon: { type: string }
        seller:
          type: object
          required: [storeName, verified]
          properties:
            storeName: { type: string }
            verified: { type: boolean }
        specs:
          type: array
          items:
            type: object
            required: [key, label, value]
            properties:
              key: { type: string }
              label: { type: string }
              value: {}
              unit: { type: string }
              main: { type: boolean }
        variants:
          type: array
          items:
            type: object
            required: [id, sku, attrs, mrpPaise, pricePaise]
            properties:
              id: { type: string, format: uuid }
              sku: { type: string }
              attrs: { type: object, additionalProperties: { type: string } }
              mrpPaise: { type: integer, format: int64 }
              pricePaise: { type: integer, format: int64 }
        images:
          type: array
          items:
            type: object
            required: [url, alt, width, height]
            properties:
              url: { type: string }
              alt: { type: string }
              width: { type: integer }
              height: { type: integer }
        updatedAt: { type: string, format: date-time }
    ProductLive:
      type: object
      required: [variants, viewer, isMember, actions, saved]
      properties:
        saved: { type: array, items: { type: string, format: uuid }, description: "Variants in the buyer's wishlist" }
        variants:
          type: array
          items:
            type: object
            required: [id, pricePaise, mrpPaise, available, electronsNonMember, electronsMember]
            properties:
              id: { type: string, format: uuid }
              pricePaise: { type: integer, format: int64 }
              mrpPaise: { type: integer, format: int64 }
              available: { type: integer }
              electronsNonMember: { type: integer, format: int64 }
              electronsMember: { type: integer, format: int64 }
        viewer: { type: string, enum: [ANONYMOUS, BUYER, SELLER, PROMOTER, CREATOR, ADMIN] }
        isMember: { type: boolean }
        actions:
          type: array
          items:
            type: object
            required: [key, enabled]
            properties:
              key: { type: string, enum: [buy_now, add_to_cart, wishlist, edit, promote, request_demo, add_review, hide] }
              enabled: { type: boolean }
              reason: { type: string, enum: [SIGN_IN, COMING_M2, COMING_M3, COMING_M4, COMING_M5, OUT_OF_STOCK, OTHER_ROLE] }
              href: { type: string }
    CartLine:
      type: object
      required: [variantId, productId, slug, name, brand, attrs, qty, pricePaise, mrpPaise, priceAtAddPaise, available]
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        attrs: { type: object, additionalProperties: { type: string } }
        coverUrl: { type: string }
        qty: { type: integer }
        pricePaise: { type: integer, format: int64 }
        mrpPaise: { type: integer, format: int64 }
        priceAtAddPaise: { type: integer, format: int64 }
        available: { type: integer }
        problem: { type: string, enum: [UNAVAILABLE, OUT_OF_STOCK, LOW_STOCK] }
    Cart:
      type: object
      required: [groups, itemCount, subtotalPaise, mrpTotalPaise, savingsPaise, electronsNonMember, electronsMember, canCheckout]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [storeName, lines, subtotalPaise]
            properties:
              storeName: { type: string }
              lines: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
              subtotalPaise: { type: integer, format: int64 }
        itemCount: { type: integer }
        subtotalPaise: { type: integer, format: int64 }
        mrpTotalPaise: { type: integer, format: int64 }
        savingsPaise: { type: integer, format: int64 }
        electronsNonMember: { type: integer, format: int64 }
        electronsMember: { type: integer, format: int64 }
        canCheckout: { type: boolean, description: False while any line has a problem }
        merged:
          type: object
          required: [lines, adjusted]
          properties:
            lines: { type: integer }
            adjusted: { type: boolean, description: Some quantities were reduced or lines dropped }
    WishItem:
      type: object
      required: [variantId, slug, name, brand, attrs, pricePaise, mrpPaise, priceAtAddPaise, priceDropped, inStock, buyable, addedAt]
      properties:
        variantId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        attrs: { type: object, additionalProperties: { type: string } }
        coverUrl: { type: string }
        pricePaise: { type: integer, format: int64 }
        mrpPaise: { type: integer, format: int64 }
        priceAtAddPaise: { type: integer, format: int64 }
        priceDropped: { type: boolean }
        inStock: { type: boolean }
        buyable: { type: boolean }
        addedAt: { type: string, format: date-time }
    Health:
      type: object
      required: [status, version, mode]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        mode: { type: string, enum: [local, ci, prototype, production] }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [up, down] }
    Problem:
      type: object
      description: RFC 9457 problem details with a stable error code (LLD 4.6)
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
    AddressInput:
      type: object
      required: [name, phone, line1, city, state, pincode]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, description: Indian mobile number; +91 and spaces are ignored }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: "^[1-9][0-9]{5}$" }
        isDefault: { type: boolean }
    DeliveryAddress:
      type: object
      required: [id, name, phone, line1, line2, city, state, pincode, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        isDefault: { type: boolean }
    QuoteLine:
      type: object
      required: [variantId, name, slug, attrs, qty, unitPricePaise, unitMrpPaise, lineTotalPaise]
      properties:
        variantId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        coverUrl: { type: string }
        attrs: { type: object, additionalProperties: { type: string } }
        qty: { type: integer }
        unitPricePaise: { type: integer, format: int64 }
        unitMrpPaise: { type: integer, format: int64 }
        lineTotalPaise: { type: integer, format: int64 }
        problem: { type: string, enum: [UNAVAILABLE, OUT_OF_STOCK, LOW_STOCK] }
    Quote:
      type: object
      required: [groups, itemCount, itemTotalPaise, mrpTotalPaise, savingsPaise, shippingPaise, payablePaise, codEligible, codLimitPaise, electronsNonMember, electronsMember, quoteHash, canPlace]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [storeName, lines, subtotalPaise]
            properties:
              storeName: { type: string }
              lines: { type: array, items: { $ref: "#/components/schemas/QuoteLine" } }
              subtotalPaise: { type: integer, format: int64 }
        itemCount: { type: integer }
        itemTotalPaise: { type: integer, format: int64 }
        mrpTotalPaise: { type: integer, format: int64 }
        savingsPaise: { type: integer, format: int64 }
        shippingPaise: { type: integer, format: int64 }
        payablePaise: { type: integer, format: int64 }
        codEligible: { type: boolean }
        codLimitPaise: { type: integer, format: int64 }
        codReason: { type: string, enum: [OVER_LIMIT, PIN_NO_COD], description: Why cash on delivery is not offered }
        delivery:
          type: object
          required: [deliverable]
          properties:
            deliverable: { type: boolean }
            etaDays: { type: integer }
            estimatedBy: { type: string, format: date-time }
        electronsNonMember: { type: integer }
        electronsMember: { type: integer }
        quoteHash: { type: string }
        canPlace: { type: boolean }
        address: { $ref: "#/components/schemas/DeliveryAddress" }
    OrderItem:
      type: object
      required: [name, slug, attrs, qty, unitPricePaise, unitMrpPaise, lineTotalPaise]
      properties:
        name: { type: string }
        slug: { type: string }
        coverUrl: { type: string }
        attrs: { type: object, additionalProperties: { type: string } }
        qty: { type: integer }
        unitPricePaise: { type: integer, format: int64 }
        unitMrpPaise: { type: integer, format: int64 }
        lineTotalPaise: { type: integer, format: int64 }
    Order:
      type: object
      required: [id, number, status, payMethod, placedAt, expiresAt, address, itemTotalPaise, mrpTotalPaise, shippingPaise, payablePaise, subOrders]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [SX-261125-K7Q2M] }
        status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, EXPIRED, CLOSED] }
        payMethod: { type: string, enum: [ONLINE, COD, ELECTRONS_ONLY] }
        placedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        address: { $ref: "#/components/schemas/DeliveryAddress" }
        itemTotalPaise: { type: integer, format: int64 }
        mrpTotalPaise: { type: integer, format: int64 }
        shippingPaise: { type: integer, format: int64 }
        payablePaise: { type: integer, format: int64 }
        subOrders:
          type: array
          items:
            type: object
            required: [id, storeName, status, subtotalPaise, items]
            properties:
              id: { type: string, format: uuid }
              storeName: { type: string }
              status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, PACKED, SHIPPED, OUT_FOR_DELIVERY, DELIVERED, EXPIRED, CANCELLED, RTO] }
              subtotalPaise: { type: integer, format: int64 }
              items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
              deliveredAt: { type: string, format: date-time }
              returnWindowEndsAt: { type: string, format: date-time }
              shipment:
                type: object
                required: [awb, courier, status, events]
                properties:
                  awb: { type: string }
                  courier: { type: string }
                  status: { type: string }
                  eta: { type: string, format: date-time }
                  events:
                    type: array
                    items:
                      type: object
                      required: [status, location, at]
                      properties:
                        status: { type: string }
                        location: { type: string }
                        at: { type: string, format: date-time }
        payment:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [CREATED, PENDING, CAPTURED, FAILED, EXPIRED] }
            failureCode: { type: string }
            checkoutUrl: { type: string, description: Present while the order can still be paid }
    OrderSummary:
      type: object
      required: [id, number, status, payablePaise, placedAt, itemCount]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        status: { type: string }
        payablePaise: { type: integer, format: int64 }
        placedAt: { type: string, format: date-time }
        itemCount: { type: integer }
        coverUrl: { type: string }
    Serviceability:
      type: object
      required: [pincode, deliverable, cod, etaDays]
      properties:
        pincode: { type: string }
        deliverable: { type: boolean }
        cod: { type: boolean }
        etaDays: { type: integer }
    Shipment:
      type: object
      required: [awb, status, codAmountPaise, courier]
      properties:
        awb: { type: string }
        status: { type: string }
        eta: { type: string, format: date-time }
        codAmountPaise: { type: integer, format: int64 }
        courier: { type: string }
  responses:
    Error:
      description: Problem details (see code)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many requests; see Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
